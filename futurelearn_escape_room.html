<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessibility Escape Room</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202333;background:#fff}*{box-sizing:border-box}body{margin:0}main{height:420px;min-height:0;display:flex;flex-direction:column;border-top:5px solid #de00a5;padding:12px 16px 10px;gap:8px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.eyebrow{font-size:11px;letter-spacing:.09em;font-weight:800;color:#de00a5}.steps{font-size:12px;color:#4b5264;font-weight:700}.meter{height:5px;background:#e8e9f1;border-radius:9px;overflow:hidden}.meter>div{height:100%;width:33.33%;background:#2541fc;transition:width .2s}h1{font-size:21px;line-height:1.12;margin:0}p{margin:0}.story{font-size:13px;line-height:1.35;color:#4b5264}.case{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}.mock{border:1px solid #cdd2df;border-radius:9px;padding:10px;background:#f6f7fb;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:55px}.mock strong{font-size:14px}.mock small{font-size:11px;color:#586071}.fake{background:#b6c0d3;color:#778196;border:0;border-radius:5px;padding:8px 12px;font-size:12px;font-weight:700;white-space:nowrap}.prompt{font-size:13px;font-weight:700}.answers{display:grid;grid-template-columns:1fr 1fr;gap:7px}.answer{background:#fff;border:1.5px solid #b9bfd0;border-radius:7px;padding:9px 10px;text-align:left;color:#202333;font-size:12px;line-height:1.25;cursor:pointer;min-height:45px}.answer[aria-pressed=true]{border-color:#2541fc;background:#eff1ff;box-shadow:inset 0 0 0 1px #2541fc}.answer:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #2541fc;outline-offset:2px}.bottom{display:flex;gap:8px;align-items:center;min-height:43px}.primary{border:0;background:#de00a5;color:white;border-radius:7px;padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.48;cursor:not-allowed}.secondary{background:#fff;color:#2541fc;border:1px solid #2541fc;border-radius:7px;padding:9px 12px;cursor:pointer;font-weight:700}.feedback{font-size:12px;line-height:1.25;flex:1}.feedback.good{color:#12633e}.feedback.bad{color:#9b2634}.finish{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}.finish h2{font-size:24px;margin:0}.finish p{font-size:14px;max-width:360px;line-height:1.4}@media(max-width:430px){main{padding:9px 10px;gap:6px}h1{font-size:18px}.story{font-size:12px}.mock{padding:7px;min-height:45px}.answers{gap:5px}.answer{padding:7px;font-size:11px;min-height:42px}.prompt{font-size:12px}.bottom{min-height:38px}.primary{padding:8px 10px}}@media(max-width:340px){.mock{min-height:40px}.answer{min-height:38px;font-size:10px}}@media(prefers-reduced-motion:reduce){.meter>div{transition:none}}
</style></head><body><main id="app"><div class="top"><span class="eyebrow">THE ACCESSIBILITY ESCAPE ROOM</span><span class="steps" id="step">LOCK 1 OF 3</span></div><div class="meter" aria-label="Progress"><div id="bar"></div></div><h1 id="heading">Unlock the service</h1><p class="story" id="story">A digital service is locked behind three accessibility barriers. Make the right design decisions to open it.</p><div class="case" id="case"><div class="mock" id="mock"></div><p class="prompt" id="prompt"></p><div class="answers" id="answers" role="group" aria-label="Choose the best solution"></div></div><div class="bottom" id="bottom"><button class="primary" type="button" id="check" disabled>Check decision</button><div class="feedback" id="feedback" role="status" aria-live="polite"></div></div></main><script>
(()=>{const questions=[{title:'Lock 1: The hidden action',story:'A resident needs to submit a form. The button looks disabled, even though it works.',mock:'<div><strong>Submit application</strong><br><small>Ready to send</small></div><span class="fake">Continue</span>',prompt:'What is the best improvement?',options:['Make the button clearly visible and distinguishable','Add a tooltip that appears only on hover','Keep the styling and add instructions elsewhere','Make the button flash to attract attention'],correct:0,why:'Clear contrast and recognisable controls help people find the action.'},{title:'Lock 2: The missing label',story:'A form asks for a postcode, but the field has no visible label.',mock:'<div><strong>Contact details</strong><br><small>Enter your information</small></div><span class="fake">________</span>',prompt:'Which change best helps everyone?',options:['Use placeholder text instead of a label','Add a persistent, programmatically associated label','Use colour to indicate what belongs in the field','Explain the field in a separate PDF'],correct:1,why:'A persistent label helps people understand the field and supports assistive technology.'},{title:'Lock 3: The keyboard trap',story:'A menu opens with a mouse, but keyboard users cannot reach its links.',mock:'<div><strong>Find a service</strong><br><small>Menu: Benefits · Housing · Travel</small></div><span class="fake">Menu ▾</span>',prompt:'What should the team do?',options:['Tell keyboard users to use a mouse','Offer a screenshot of the menu','Make the menu operable using a keyboard with visible focus','Remove the menu and leave the page blank'],correct:2,why:'All essential navigation must work with a keyboard, with a visible focus indicator.'}];let index=0,selected=-1,solved=0;const $=id=>document.getElementById(id);function render(){const q=questions[index];$('step').textContent=`LOCK ${index+1} OF 3`;$('bar').style.width=`${(index+1)/3*100}%`;$('heading').textContent=q.title;$('story').textContent=q.story;$('mock').innerHTML=q.mock;$('prompt').textContent=q.prompt;$('answers').replaceChildren();q.options.forEach((text,i)=>{let b=document.createElement('button');b.type='button';b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+text;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{selected=i;[...$('answers').children].forEach((el,j)=>el.setAttribute('aria-pressed',String(j===i)));$('check').disabled=false;$('feedback').textContent='';});$('answers').append(b)});selected=-1;$('check').disabled=true;$('check').textContent='Check decision';$('feedback').textContent='';$('feedback').className='feedback';$('check').onclick=check}function check(){if(selected<0)return;const q=questions[index];if(selected!==q.correct){$('feedback').textContent='Not quite. Try another approach.';$('feedback').className='feedback bad';return}solved++;$('feedback').textContent='Unlocked! '+q.why;$('feedback').className='feedback good';$('check').textContent=index===2?'Finish':'Next lock';$('check').onclick=()=>{if(index===2)finish();else{index++;render()}}}function finish(){$('step').textContent='COMPLETE';$('bar').style.width='100%';$('heading').textContent='All locks opened';$('story').textContent='';$('case').innerHTML='<div class="finish"><h2>Service unlocked!</h2><p>You identified three barriers and chose improvements that make a digital service easier to use.</p><button class="secondary" id="restart" type="button">Play again</button></div>';$('bottom').hidden=true;$('restart').addEventListener('click',()=>{index=0;solved=0;$('bottom').hidden=false;render()})}render()})();
</script></body></html>
