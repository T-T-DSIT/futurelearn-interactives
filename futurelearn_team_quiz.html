<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning design team | Quick check</title>
<style>
:root{--pink:#de00a5;--blue:#377db8;--ink:#24242a;--line:#d9dce2;--blue-tint:rgba(55,125,184,.11)}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{padding:10px 14px 12px;max-width:740px;margin:auto;border-top:4px solid var(--pink)}.eyebrow{color:#9c0074;font-size:11px;letter-spacing:.055em;font-weight:700;margin:0 0 5px}h1{font-size:19px;line-height:1.2;margin:0 0 9px;font-weight:750}fieldset{border:0;padding:0;margin:0}legend{font-size:12px;font-weight:700;margin:0 0 5px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.answer{border:1px solid var(--line);border-radius:5px;display:flex;gap:9px;align-items:center;padding:8px 10px;min-height:40px;cursor:pointer;background:#fff;font-size:14px}.answer:has(input:checked){border-color:var(--blue);background:var(--blue-tint);box-shadow:inset 0 0 0 1px var(--blue)}input{margin:0;flex:none;width:16px;height:16px;accent-color:var(--blue)}.answer:focus-within,button:focus-visible{outline:3px solid #a64d00;outline-offset:2px}.bottom{display:flex;align-items:stretch;gap:8px;margin-top:8px}button{border:0;border-radius:5px;background:var(--pink);color:#fff;padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px}button:hover{background:#ae0082}#feedback{border-left:4px solid var(--blue);background:#f1f6fa;padding:7px 10px;font-size:13px;line-height:1.3;flex:1;min-width:0}#feedback[hidden]{display:none}#feedback strong{display:block;margin-bottom:2px}@media(max-width:430px){main{padding:9px 10px 10px}h1{font-size:18px}.answers{grid-template-columns:1fr}.answer{min-height:39px;padding:7px 9px}.bottom{flex-wrap:wrap}#feedback{flex-basis:100%}}
</style></head><body><main><p class="eyebrow">QUICK KNOWLEDGE CHECK</p><h1>Who is on the Learning Design team?</h1><form id="quiz"><fieldset><legend>Select one answer</legend><div class="answers"><label class="answer"><input type="radio" name="answer" value="sarah">Sarah</label><label class="answer"><input type="radio" name="answer" value="thomas">Thomas</label><label class="answer"><input type="radio" name="answer" value="barry">Barry</label><label class="answer"><input type="radio" name="answer" value="thi">Thi</label><label class="answer"><input type="radio" name="answer" value="all">All of the above</label></div></fieldset><div class="bottom"><button type="submit">Check answer</button><div id="feedback" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden><strong id="feedback-heading"></strong><span id="feedback-text"></span></div></div></form></main><script>
(function(){const form=document.getElementById('quiz'),box=document.getElementById('feedback'),head=document.getElementById('feedback-heading'),text=document.getElementById('feedback-text');form.addEventListener('submit',function(e){e.preventDefault();const checked=form.querySelector('input[name="answer"]:checked');if(!checked){head.textContent='Choose an answer';text.textContent='Select one option, then check your answer.';}else if(checked.value==='all'){head.textContent='Correct';text.textContent='All of the above is the intended answer.';}else{head.textContent='Not quite';text.textContent='That is only one of the names listed. Try again.';}box.hidden=false;box.focus({preventScroll:true});});})();
</script></body></html>
