<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match the accessibility barriers</title><style>
:root{--pink:#de00a5;--blue:#2541fc;--ink:#302e34;font-family:Europa,'Helvetica Neue',Arial,sans-serif;color:var(--ink)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff}main{border-top:4px solid var(--pink);height:100dvh;padding:10px 15px 9px;display:flex;flex-direction:column;overflow:hidden}.eyebrow{color:var(--pink);font-size:11px;font-weight:700;margin:0 0 3px}h1{font-size:19px;line-height:1.18;margin:0 0 4px}p{font-size:12px;line-height:1.3;margin:0 0 7px}.board{display:grid;grid-template-columns:1fr 1.18fr;gap:12px;min-height:0;flex:1}.title{font-size:12px;font-weight:700;margin:0 0 5px}.source,.zones{display:flex;flex-direction:column;gap:7px}.chip,.zone{font:inherit;border-radius:5px;min-height:52px;padding:8px 11px;display:flex;align-items:center;text-align:left}.chip{background:#fff;border:1px solid #bfc4d2;font-size:13px;cursor:grab;touch-action:none}.chip[aria-pressed=true]{background:#eef0ff;border:2px solid var(--blue);padding:7px 10px}.chip.assigned{opacity:.5}.chip.dragging{opacity:.4}.zone{border:2px dashed #a7a9b7;background:#fafafa;gap:7px;cursor:pointer;flex-wrap:wrap}.zone.over,.zone:focus-visible{border-color:var(--blue);background:#eef0ff}.zone .label{font-size:12px;font-weight:700;min-width:72px}.zone .value{font-size:12px;color:#302e34;flex:1}.zone.filled{border-style:solid;border-color:var(--blue);background:#eef0ff}.zone .remove{border:0;background:transparent;color:#1b2db0;font-weight:700;cursor:pointer;font-size:15px;padding:4px}.chip:focus-visible,.zone:focus-visible,.action:focus-visible{outline:3px solid #222;outline-offset:2px}.actions{display:flex;align-items:center;gap:9px;min-height:39px;margin-top:8px}.action{background:var(--pink);border:0;border-radius:4px;color:white;font:700 12px Europa,Arial,sans-serif;padding:9px 14px;cursor:pointer}.action.secondary{background:white;color:var(--ink);border:1px solid #999}#feedback{flex:1;background:#eef0ff;border-left:3px solid var(--blue);padding:7px 9px;font-size:12px;line-height:1.3}#feedback[hidden]{display:none}.help{font-size:11px;color:#555;margin:5px 0 0}@media(max-height:390px) and (min-width:481px){main{padding:7px 12px 5px}h1{font-size:17px}.chip,.zone{min-height:43px;padding:5px 8px}.source,.zones{gap:4px}.help{margin-top:2px}}@media(max-width:480px){html,body{height:auto}main{height:auto;min-height:100dvh;overflow:visible}.board{grid-template-columns:1fr}.chip,.zone{min-height:44px}.actions{flex-wrap:wrap}#feedback{flex-basis:100%}}
</style></head><body><main><p class="eyebrow">PRACTICE ACTIVITY</p><h1>Match the accessibility barriers</h1><p>Drag each example into a category. Alternatively, select an example and then select its category.</p><div class="board"><section aria-labelledby="examples-title"><h2 class="title" id="examples-title">Examples</h2><div class="source" id="source"><button class="chip" type="button" draggable="true" data-id="sun" aria-pressed="false">Bright sunlight on a screen</button><button class="chip" type="button" draggable="true" data-id="arm" aria-pressed="false">A broken arm</button><button class="chip" type="button" draggable="true" data-id="hearing" aria-pressed="false">Long-term hearing loss</button></div><p class="help">Keyboard: Tab to an example, press Enter, then Tab to a category and press Enter.</p></section><section aria-labelledby="categories-title"><h2 class="title" id="categories-title">Drop zones</h2><div class="zones" id="zones"><button class="zone" type="button" data-category="situational"><span class="label">Situational</span><span class="value">Drop here</span></button><button class="zone" type="button" data-category="temporary"><span class="label">Temporary</span><span class="value">Drop here</span></button><button class="zone" type="button" data-category="permanent"><span class="label">Permanent</span><span class="value">Drop here</span></button></div></section></div><div class="actions"><button class="action" id="check" type="button">Check answers</button><button class="action secondary" id="reset" type="button">Reset</button><div id="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div></div></main><script>
(()=>{const root=document.querySelector('main'),chips=[...root.querySelectorAll('.chip')],zones=[...root.querySelectorAll('.zone')],feedback=root.querySelector('#feedback');const labels={sun:'Bright sunlight on a screen',arm:'A broken arm',hearing:'Long-term hearing loss'};const state={situational:'',temporary:'',permanent:''};let selected='';function render(){chips.forEach(chip=>{chip.setAttribute('aria-pressed',String(chip.dataset.id===selected));chip.classList.toggle('assigned',Object.values(state).includes(chip.dataset.id));});zones.forEach(zone=>{const value=state[zone.dataset.category];zone.querySelector('.value').textContent=value?labels[value]:'Drop here';zone.classList.toggle('filled',!!value);zone.setAttribute('aria-label',zone.dataset.category+': '+(value?labels[value]:'empty')+'. Activate to place selected example.');});feedback.hidden=true;}function assign(category,id){if(!labels[id])return;for(const key of Object.keys(state)){if(state[key]===id)state[key]='';}state[category]=id;selected='';render();}chips.forEach(chip=>{chip.addEventListener('click',()=>{selected=chip.dataset.id;render();});chip.addEventListener('dragstart',event=>{selected=chip.dataset.id;event.dataTransfer.setData('text/plain',selected);event.dataTransfer.effectAllowed='move';chip.classList.add('dragging');});chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));});zones.forEach(zone=>{zone.addEventListener('click',()=>{if(selected){assign(zone.dataset.category,selected);}else if(state[zone.dataset.category]){state[zone.dataset.category]='';render();}});zone.addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='move';zone.classList.add('over');});zone.addEventListener('dragleave',()=>zone.classList.remove('over'));zone.addEventListener('drop',event=>{event.preventDefault();zone.classList.remove('over');assign(zone.dataset.category,event.dataTransfer.getData('text/plain'));});});root.querySelector('#check').addEventListener('click',()=>{const complete=Object.values(state).every(Boolean);feedback.textContent=!complete?'Place an example in every category before checking.':state.situational==='sun'&&state.temporary==='arm'&&state.permanent==='hearing'?'Correct. Each example matches its category.':'Not quite. Consider whether the difficulty is environmental, short-term or long-term.';feedback.hidden=false;});root.querySelector('#reset').addEventListener('click',()=>{for(const key of Object.keys(state))state[key]='';selected='';render();});render();})();
</script></body></html>
