<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick knowledge check | Learning Design team</title>
<style>
:root{--pink:#de00a5;--blue:#2541fc;--ink:#373239;--line:#cfd2da;--selected:#eef0ff;--focus:#111827}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:Europa,"Helvetica Neue",Arial,sans-serif}
main{width:100%;min-height:410px;padding:22px 22px 18px;border-top:4px solid var(--pink);display:flex;flex-direction:column}
.eyebrow{margin:0 0 3px;color:#a00078;font-size:12px;line-height:1.3;font-weight:700;letter-spacing:.02em}
h1{font-size:23px;line-height:1.25;margin:0 0 20px;font-weight:700}
form{display:flex;flex:1;flex-direction:column}fieldset{margin:0;padding:0;border:0;min-width:0}
legend{font-size:14px;line-height:1.35;font-weight:700;margin-bottom:12px;padding:0}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.answer{display:flex;align-items:center;gap:9px;min-height:66px;padding:12px 15px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:15px;line-height:1.3;cursor:pointer;transition:background-color .12s,border-color .12s}
.answer:hover{border-color:var(--blue)}
.answer:has(input:checked){background:var(--selected);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.answer input{margin:0;width:17px;height:17px;flex:none;accent-color:var(--blue)}
.answer:focus-within,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.actions{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:18px;min-height:70px}
button{border:0;border-radius:5px;background:var(--pink);color:#fff;font:700 14px Europa,"Helvetica Neue",Arial,sans-serif;line-height:1.3;padding:10px 15px;min-height:46px;cursor:pointer;flex:none}
button:hover{background:#ae0082}
#feedback{flex:1;min-width:0;padding:8px 11px;background:#f2f3ff;border-left:4px solid var(--blue);font-size:14px;line-height:1.4}
#feedback[hidden]{display:none}
#feedback strong{display:block;margin-bottom:2px}
@media(max-width:480px){main{min-height:0;padding:15px 12px}h1{font-size:20px;margin-bottom:12px}.answers{grid-template-columns:1fr;gap:7px}.answer{min-height:44px;padding:8px 12px}.actions{margin-top:8px;padding-top:8px;min-height:0;flex-wrap:wrap}#feedback{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){.answer{transition:none}}
</style>
</head>
<body>
<main>
<p class="eyebrow">QUICK KNOWLEDGE CHECK</p>
<h1>Who is on the Learning Design team?</h1>
<form id="quiz">
<fieldset><legend>Select one answer</legend>
<div class="answers">
<label class="answer"><input type="radio" name="answer" value="sarah">Sarah</label>
<label class="answer"><input type="radio" name="answer" value="thomas">Thomas</label>
<label class="answer"><input type="radio" name="answer" value="barry">Barry</label>
<label class="answer"><input type="radio" name="answer" value="thi">Thi</label>
<label class="answer"><input type="radio" name="answer" value="all">All of the above</label>
</div></fieldset>
<div class="actions"><button type="submit">Check answer</button>
<div id="feedback" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden><strong id="feedback-heading"></strong><span id="feedback-text"></span></div>
</div>
</form>
</main>
<script>
(()=>{const form=document.getElementById('quiz'),box=document.getElementById('feedback'),head=document.getElementById('feedback-heading'),text=document.getElementById('feedback-text');form.addEventListener('submit',e=>{e.preventDefault();const selected=form.querySelector('input[name="answer"]:checked');if(!selected){head.textContent='Choose an answer';text.textContent='Select one option, then check your answer.'}else if(selected.value==='all'){head.textContent='Correct';text.textContent='All of the above is the intended answer.'}else{head.textContent='Not quite';text.textContent='That is only one of the names listed. Try again.'}box.hidden=false;box.focus({preventScroll:true})});form.querySelectorAll('input[name="answer"]').forEach(input=>input.addEventListener('change',()=>{box.hidden=true}))})();
</script>
</body>
</html>
