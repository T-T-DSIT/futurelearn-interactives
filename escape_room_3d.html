*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#11182a;color:#fff}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffca57;outline-offset:2px}#app{height:420px;width:100%;max-width:100%;position:relative;overflow:hidden;background:#151d30}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}.brand{background:#111a2cdd;border:1px solid #ffffff33;border-radius:9px;padding:8px 10px;backdrop-filter:blur(8px)}.brand small{display:block;font-size:9px;letter-spacing:1.8px;color:#ff8cdb;font-weight:800}.brand b{font-size:15px}.progress{background:#111a2cdd;border:1px solid #ffffff33;border-radius:9px;padding:8px 10px;font-size:11px;white-space:nowrap}.progress strong{color:#ffca57}.bottom{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}.hint{max-width:320px;background:#111a2ce8;border:1px solid #ffffff33;border-radius:9px;padding:8px 10px;font-size:11px;line-height:1.45}.hint b{color:#ffca57}.controls{display:flex;gap:5px;pointer-events:auto}.controls button,.topbutton{border:1px solid #ffffff55;background:#17213adf;color:#fff;border-radius:8px;padding:9px;font-size:12px;font-weight:700}.topbutton{pointer-events:auto}.tools{position:absolute;top:65px;right:12px;display:flex;gap:6px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#ffffffa8;pointer-events:none;text-shadow:0 1px 5px #000}.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);max-width:90%;background:#111a2cee;border:1px solid #ffca57;border-radius:8px;padding:8px 12px;font-size:12px;text-align:center;pointer-events:none}.modal{position:absolute;inset:0;background:#0a1023d9;display:grid;place-items:center;padding:12px;z-index:5}.modal[hidden],.toast[hidden]{display:none}.card{width:min(100%,490px);background:#fff;color:#172039;border-radius:15px;padding:17px 19px;box-shadow:0 20px 60px #0009;border-top:5px solid #de00a5;max-height:calc(100% - 8px);overflow:auto}.card small{font-weight:800;letter-spacing:1.3px;color:#ae0080;font-size:10px}.card h2{font-size:21px;line-height:1.15;margin:6px 0}.card p{font-size:12px;line-height:1.45;margin:6px 0 10px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choices button{border:1.5px solid #cbd2e5;border-radius:8px;background:#f7f8fd;text-align:left;padding:9px;font-size:12px;min-height:45px;color:#19243a}.choices button:hover{border-color:#2541fc}.choices button[aria-pressed=true]{border:2px solid #2541fc;background:#e9edff}.action{background:#de00a5;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:800;font-size:12px}.action:disabled{opacity:.45}.row{display:flex;align-items:center;gap:9px;margin-top:9px}.message{font-size:12px;font-weight:700;line-height:1.3;flex:1}.exit{background:#2541fc}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:470px){.brand b{font-size:12px}.brand small{font-size:8px}.progress{font-size:10px}.hint{font-size:10px;max-width:53%}.controls button{padding:8px}.card{padding:12px}.card h2{font-size:18px}.choices button{font-size:11px;padding:7px}.tools{top:62px}}
</style></head><body><div id="app"><canvas id="view" aria-hidden="true"></canvas><div class="cross" aria-hidden="true">+</div><div class="hud"><div class="brand"><small>INTERACTIVE EXPERIENCE</small><b>THE LOCKED SERVICE</b></div><div class="progress">ACCESS RESTORED <strong id="score">0 / 3</strong></div></div><div class="tools"><button class="topbutton" id="inspect" type="button">Inspect nearby</button><button class="topbutton" id="guide" type="button">Accessible controls</button></div><div class="toast" id="toast" role="status" aria-live="polite" hidden></div><div class="bottom"><div class="hint" id="hint"><b>MISSION:</b> Restore accessibility to three terminals, then unlock the exit.<br>Move: WASD / arrows · Look: drag or ◀ ▶ · Interact: E / click</div><div class="controls"><button id="left" type="button" aria-label="Turn left">◀</button><button id="forward" type="button" aria-label="Move forward">▲</button><button id="right" type="button" aria-label="Turn right">▶</button><button id="use" type="button">Inspect</button></div></div><div class="modal" id="modal"><div class="card" id="modalCard"></div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);const map=['111111111111','100000000001','100000000001','100000000001','100000000001','100000000001','100000000001','100000000001','111111111111'];const objects=[{x:2.3,y:2.0,name:'Contrast terminal',symbol:'◐',color:'#ffb64c',done:false,question:'A pale-grey button is difficult to distinguish from its background. What should the service team do?',answers:['Add a tooltip explaining where to click','Increase contrast and make the control visually clear','Use colour alone to identify the button'],correct:1,reason:'Clear visual contrast helps people identify controls. Tooltips and colour alone are not substitutes.'},{x:9.3,y:2.0,name:'Form terminal',symbol:'⌨',color:'#4adbd1',done:false,question:'A postcode input only uses placeholder text, which disappears when typing. What is the best fix?',answers:['Use a persistent, programmatically associated label','Make the placeholder text smaller','Add a longer paragraph above the form'],correct:0,reason:'Persistent labels make the purpose of a field clear, including for assistive technology.'},{x:3.2,y:6.6,name:'Navigation terminal',symbol:'⇥',color:'#bd9cff',done:false,question:'A menu works with a mouse but not a keyboard. Which change addresses the barrier?',answers:['Add an animation to the menu','Ask keyboard users to use a touchscreen','Support keyboard operation and visible focus'],correct:2,reason:'Keyboard operation and visible focus are essential for accessible navigation.'},{x:9.2,y:6.5,name:'Exit door',symbol:'⇧',color:'#ff77ba',exit:true}];let player={x:6,y:4.5,a:-Math.PI/2},keys=new Set(),active=null,selected=-1,mode='intro',last=0,dragging=false,dragX=0,toastTimer;const FOV=Math.PI/2.8;function openModal(html){$('modalCard').innerHTML=html;$('modal').hidden=false;keys.clear();let b=$('modalCard').querySelector('button');if(b)b.focus()}function closeModal(){$('modal').hidden=true;mode='play';$('inspect').focus()}function say(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2400)}function intro(){mode='intro';openModal('<small>ACCESSIBILITY ESCAPE ROOM</small><h2>Welcome to the locked service</h2><p>You are inside a fictional digital service. Three terminals are malfunctioning. Explore the room, inspect each terminal and make a design decision to restore access.</p><p><b>Move:</b> WASD or arrow keys. <b>Look:</b> left/right or drag. <b>Interact:</b> E, click a terminal or use “Inspect nearby”.</p><p>A fully keyboard-operated list of locations is available under <b>Accessible controls</b>.</p><div class="row"><button class="action" id="start">Enter the room</button></div>');$('start').onclick=closeModal}function nearby(){return objects.map((o,i)=>({...o,i,d:Math.hypot(o.x-player.x,o.y-player.y)})).sort((a,b)=>a.d-b.d)}function inspect(){let n=nearby()[0];if(n.d>2.8){say('Move closer to a glowing terminal or use Accessible controls.');return}activate(n.i)}function activate(i){const o=objects[i];if(o.exit){if(objects.slice(0,3).every(x=>x.done)){mode='complete';openModal('<small>MISSION COMPLETE</small><h2>Service unlocked!</h2><p>You restored access by fixing contrast, form labels and keyboard navigation.</p><p>In a real service, accessibility requires wider testing with disabled users and assistive technologies. These three examples are only a starting point.</p><div class="row"><button class="action" id="again">Explore again</button></div>');$('again').onclick=()=>{objects.slice(0,3).forEach(x=>x.done=false);$('score').textContent='0 / 3';player={x:6,y:4.5,a:-Math.PI/2};closeModal()}}else say('Exit locked. Restore all three terminals first.');return}if(o.done){say(o.name+' already restored.');return}active=i;selected=-1;mode='question';openModal('<small>TERMINAL '+(i+1)+' / 3</small><h2>'+o.name+'</h2><p>'+o.question+'</p><div class="choices" id="choices"></div><div class="row"><button class="action" id="submit" disabled>Apply fix</button><span class="message" id="result" role="status" aria-live="polite"></span></div>');o.answers.forEach((a,j)=>{const b=document.createElement('button');b.type='button';b.textContent=a;b.setAttribute('aria-pressed','false');b.onclick=()=>{selected=j;[...$('choices').children].forEach((c,k)=>c.setAttribute('aria-pressed',String(k===j)));$('submit').disabled=false;$('result').textContent=''};$('choices').append(b)});$('submit').onclick=()=>{if(selected===o.correct){o.done=true;$('score').textContent=objects.slice(0,3).filter(x=>x.done).length+' / 3';$('result').textContent='Restored! '+o.reason;$('result').style.color='#17663d';$('submit').textContent='Return to room';$('submit').onclick=closeModal}else{$('result').textContent='Not quite. Try a different solution.';$('result').style.color='#a22d37'}}}function accessible(){mode='guide';openModal('<small>ACCESSIBLE EXPLORATION</small><h2>Choose a location</h2><p>Use these buttons to inspect any terminal without navigating the 3D scene. All puzzles and feedback are identical.</p><div class="choices" id="locations"></div><div class="row"><button class="action exit" id="return">Return to room</button></div>');objects.forEach((o,i)=>{let b=document.createElement('button');b.type='button';b.textContent=o.name+(o.done?' — restored':'')+(o.exit?' — exit':'');b.onclick=()=>activate(i);$('locations').append(b)});$('return').onclick=closeModal}function wall(x,y){return map[Math.floor(y)]?.[Math.floor(x)]!=='0'}function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d))}window.addEventListener('resize',resize);resize();let depth=[];function draw(){const w=canvas.width,h=canvas.height;let sky=ctx.createLinearGradient(0,0,0,h*.54);sky.addColorStop(0,'#0b152a');sky.addColorStop(1,'#273957');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h/2);let floor=ctx.createLinearGradient(0,h/2,0,h);floor.addColorStop(0,'#3c4758');floor.addColorStop(1,'#101723');ctx.fillStyle=floor;ctx.fillRect(0,h/2,w,h/2);ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;for(let z=1;z<13;z++){const yy=h/2+h/(z*1.1);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke()}const stripe=Math.max(2,Math.round(w/320));depth=[];for(let sx=0;sx<w;sx+=stripe){const ray=player.a+Math.atan((2*sx/w-1)*Math.tan(FOV/2));let dist=.02,hitX=0,hitY=0;while(dist<18){hitX=player.x+Math.cos(ray)*dist;hitY=player.y+Math.sin(ray)*dist;if(wall(hitX,hitY))break;dist+=.035}const corrected=dist*Math.cos(ray-player.a),wh=Math.min(h*2,h/(corrected*.65));let side=Math.min(hitX%1,1-hitX%1)<Math.min(hitY%1,1-hitY%1);const v=Math.max(32,Math.floor(140/(1+corrected*.11))-(side?20:0));ctx.fillStyle=`rgb(${Math.floor(v*.66)},${Math.floor(v*.79)},${v})`;ctx.fillRect(sx,(h-wh)/2,stripe+1,wh);ctx.fillStyle='#ffffff0c';ctx.fillRect(sx,(h-wh)/2,stripe+1,Math.max(2,wh*.018));depth[Math.floor(sx/stripe)]=corrected}let visible=[];objects.forEach((o,i)=>{const dx=o.x-player.x,dy=o.y-player.y,d=Math.hypot(dx,dy);let angle=Math.atan2(dy,dx)-player.a;while(angle>Math.PI)angle-=Math.PI*2;while(angle< -Math.PI)angle+=Math.PI*2;if(Math.abs(angle)>FOV*.72)return;let px=w/2+Math.tan(angle)/Math.tan(FOV/2)*w/2;let size=Math.min(h*.62,h/(d*.68));if(d<.3)return;let z=depth[Math.max(0,Math.min(depth.length-1,Math.floor(px/stripe)))];if(z&&d>z+.3)return;visible.push({i,px,size,d})});visible.sort((a,b)=>b.d-a.d);for(let s of visible){const o=objects[s.i],x=s.px,y=h/2-s.size*.35;ctx.save();ctx.shadowColor=o.done?'#5ce9ad':o.color;ctx.shadowBlur=s.size*.18;ctx.fillStyle=o.done?'#163e38':'#17223d';ctx.strokeStyle=o.done?'#68ffba':o.color;ctx.lineWidth=Math.max(2,s.size*.035);let rw=s.size*.66,rh=s.size*.78;ctx.beginPath();ctx.roundRect(x-rw/2,y-rh/2,rw,rh,Math.max(4,s.size*.07));ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=o.done?'#82ffd0':o.color;ctx.font=`bold ${Math.max(14,s.size*.3)}px Arial`;ctx.textAlign='center';ctx.fillText(o.done?'✓':o.symbol,x,y+s.size*.06);ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(8,s.size*.08)}px Arial`;ctx.fillText(o.exit?'EXIT':`0${s.i+1}`,x,y+s.size*.25);ctx.restore()}window.visibleObjects=visible;const n=nearby()[0];if(mode==='play')$('hint').innerHTML='<b>'+(n.d<2.8?'NEARBY: '+n.name:'MISSION: RESTORE THREE TERMINALS')+'</b><br>'+(n.d<2.8?'Press E or Inspect to interact.':'WASD / arrows to move · Drag to look · E to inspect')}function tick(t){let dt=Math.min((t-last)/1000,.04);last=t;if(mode==='play'){let rot=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);player.a+=rot*dt*1.9;let move=(keys.has('ArrowUp')||keys.has('w')?1:0)-(keys.has('ArrowDown')||keys.has('s')?1:0);let strafe=(keys.has('q')?-1:0)+(keys.has('r')?1:0);let nx=player.x+Math.cos(player.a)*move*dt*2.1+Math.cos(player.a+Math.PI/2)*strafe*dt*2,ny=player.y+Math.sin(player.a)*move*dt*2.1+Math.sin(player.a+Math.PI/2)*strafe*dt*2;if(!wall(nx+.2*Math.sign(nx-player.x),player.y))player.x=nx;if(!wall(player.x,ny+.2*Math.sign(ny-player.y)))player.y=ny}draw();requestAnimationFrame(tick)}window.addEventListener('keydown',e=>{if(mode!=='play')return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e'&&!e.repeat){inspect();return}keys.add(e.key.length===1?e.key.toLowerCase():e.key)});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());$('guide').onclick=accessible;$('inspect').onclick=inspect;$('use').onclick=inspect;[['left','ArrowLeft'],['right','ArrowRight'],['forward','ArrowUp']].forEach(([id,key])=>{let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(key);el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys.delete(key)))});canvas.addEventListener('pointerdown',e=>{dragging=true;dragX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(dragging&&mode==='play'){player.a+=(e.clientX-dragX)*.008;dragX=e.clientX}});canvas.addEventListener('pointerup',e=>{dragging=false;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width;let near=window.visibleObjects?.filter(o=>Math.abs(o.px-x)<o.size*.4).sort((a,b)=>a.d-b.d)[0];if(near&&near.d<3.5)activate(near.i)});intro();requestAnimationFrame(tick)})();
