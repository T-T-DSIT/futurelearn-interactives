<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessibility: match the barrier</title><style>
:root{font-family:Europa,'Helvetica Neue',Arial,sans-serif;color:#302e34;--pink:#de00a5;--blue:#2541fc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff}main{height:100dvh;min-height:0;display:flex;flex-direction:column;padding:12px 18px 10px;border-top:4px solid var(--pink);overflow:hidden}.eyebrow{color:var(--pink);font-size:11px;font-weight:700;margin:0 0 3px}h1{font-size:19px;line-height:1.2;margin:0 0 4px}p{margin:0 0 7px;font-size:12px;line-height:1.3}.layout{display:grid;grid-template-columns:1fr 1.2fr;gap:12px;min-height:0;flex:1}.column-title{font-size:12px;font-weight:700;margin:0 0 5px}.items,.targets{display:flex;flex-direction:column;gap:7px}.item{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:49px;padding:7px 10px;border:1px solid #cdd0d8;border-radius:5px;background:#fff;color:inherit;font:inherit;font-size:13px;text-align:left;cursor:grab}.item:focus-visible,.target:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #222;outline-offset:2px}.item[aria-pressed=true]{border:2px solid var(--blue);padding:6px 9px;background:#eef0ff}.item[draggable=true]:active{cursor:grabbing}.target{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:49px;padding:6px 9px;border:1px dashed #9b9fae;border-radius:5px;background:#fafafa;font-size:12px}.target.over{border:2px solid var(--blue);background:#eef0ff;padding:5px 8px}.target label{font-weight:700;flex:1}.target select{font:inherit;font-size:12px;max-width:52%;min-width:110px;border:1px solid #aeb2c0;background:#fff;border-radius:4px;padding:5px;color:#302e34}.actions{display:flex;align-items:center;gap:9px;margin-top:8px;min-height:39px}button.action{background:var(--pink);color:white;border:0;border-radius:4px;padding:9px 14px;font:700 12px Europa,Arial,sans-serif;cursor:pointer}button.reset{background:#fff;color:#302e34;border:1px solid #8f929a}#feedback{font-size:12px;line-height:1.25;background:#eef0ff;border-left:3px solid var(--blue);padding:7px 9px;flex:1}#feedback[hidden]{display:none}.hint{font-size:11px;color:#55515d;margin:5px 0 0}@media(max-height:380px) and (min-width:481px){main{padding:7px 12px 6px}h1{font-size:17px}p{margin-bottom:4px}.items,.targets{gap:4px}.item,.target{min-height:41px}.actions{margin-top:5px}}@media(max-width:480px){html,body{height:auto}main{height:auto;min-height:100dvh;overflow:visible}.layout{grid-template-columns:1fr}.items{display:none}.target{min-height:48px}.target select{max-width:56%}}
</style></head><body><main><p class="eyebrow">PRACTICE ACTIVITY</p><h1>Match the accessibility barrier</h1><p>Drag each example to a category, or use the dropdowns. Both methods work.</p><div class="layout"><section><h2 class="column-title">Examples</h2><div class="items" id="items"><button type="button" class="item" draggable="true" data-value="sun" aria-pressed="false">Bright sunlight on a screen</button><button type="button" class="item" draggable="true" data-value="arm" aria-pressed="false">A broken arm</button><button type="button" class="item" draggable="true" data-value="hearing" aria-pressed="false">Long-term hearing loss</button></div><p class="hint">Keyboard: select an example, then choose its category below.</p></section><section><h2 class="column-title">Categories</h2><div class="targets" id="targets"><div class="target" data-category="situational"><label for="situational">Situational</label><select id="situational" aria-label="Example for situational barrier"><option value="">Choose an example</option><option value="sun">Bright sunlight on a screen</option><option value="arm">A broken arm</option><option value="hearing">Long-term hearing loss</option></select></div><div class="target" data-category="temporary"><label for="temporary">Temporary</label><select id="temporary" aria-label="Example for temporary impairment"><option value="">Choose an example</option><option value="sun">Bright sunlight on a screen</option><option value="arm">A broken arm</option><option value="hearing">Long-term hearing loss</option></select></div><div class="target" data-category="permanent"><label for="permanent">Permanent</label><select id="permanent" aria-label="Example for permanent impairment"><option value="">Choose an example</option><option value="sun">Bright sunlight on a screen</option><option value="arm">A broken arm</option><option value="hearing">Long-term hearing loss</option></select></div></div></section></div><div class="actions"><button type="button" class="action" id="check">Check answers</button><button type="button" class="action reset" id="reset">Reset</button><div id="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div></div></main><script>
(()=>{const root=document.querySelector('main');const items=[...root.querySelectorAll('.item')];const targets=[...root.querySelectorAll('.target')];let selected='';const feedback=root.querySelector('#feedback');function assign(category,value){if(!value)return;targets.forEach(t=>{const s=t.querySelector('select');if(t.dataset.category!==category&&s.value===value)s.value=''});root.querySelector('[data-category="'+category+'"] select').value=value;items.forEach(b=>b.setAttribute('aria-pressed','false'));selected='';feedback.hidden=true}items.forEach(b=>{b.addEventListener('click',()=>{selected=b.dataset.value;items.forEach(i=>i.setAttribute('aria-pressed',String(i===b)));});b.addEventListener('dragstart',e=>{selected=b.dataset.value;e.dataTransfer.setData('text/plain',selected);e.dataTransfer.effectAllowed='move'});});targets.forEach(t=>{t.addEventListener('dragover',e=>{e.preventDefault();t.classList.add('over')});t.addEventListener('dragleave',()=>t.classList.remove('over'));t.addEventListener('drop',e=>{e.preventDefault();t.classList.remove('over');const value=e.dataTransfer.getData('text/plain');if(['sun','arm','hearing'].includes(value))assign(t.dataset.category,value)});t.addEventListener('click',e=>{if(e.target.tagName==='SELECT'||!selected)return;assign(t.dataset.category,selected)});t.querySelector('select').addEventListener('change',e=>{const value=e.target.value;if(value)assign(t.dataset.category,value);else feedback.hidden=true});});root.querySelector('#check').addEventListener('click',()=>{const values=Object.fromEntries(targets.map(t=>[t.dataset.category,t.querySelector('select').value]));if(Object.values(values).some(v=>!v)){feedback.textContent='Match an example to every category before checking.'}else{const correct=values.situational==='sun'&&values.temporary==='arm'&&values.permanent==='hearing';feedback.textContent=correct?'Correct. Situational barriers depend on circumstances; temporary impairments may resolve; permanent impairments are long-term.':'Not quite. Think about whether the difficulty comes from the surroundings, a short-term injury or a long-term impairment.'}feedback.hidden=false;});root.querySelector('#reset').addEventListener('click',()=>{targets.forEach(t=>t.querySelector('select').value='');items.forEach(b=>b.setAttribute('aria-pressed','false'));selected='';feedback.hidden=true});})();
</script></body></html>
