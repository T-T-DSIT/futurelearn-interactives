<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessibility: guess the numbers</title><style>
:root{font-family:Europa,'Helvetica Neue',Arial,sans-serif;color:#373239}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;overflow-x:hidden}.quiz{width:100%;border-top:4px solid #de00a5;padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;overflow:visible}h1{font-size:20px;line-height:1.2;margin:0}.intro{font-size:13px;line-height:1.35;margin:0}.progress{font-size:12px;font-weight:700}.track{height:4px;background:#ece8ee;border-radius:4px;overflow:hidden}.track span{display:block;background:#de00a5;height:100%;width:20%}fieldset{border:0;padding:0;margin:0}legend{font-size:16px;line-height:1.3;font-weight:700;padding:0;margin:0 0 8px}.guess{display:flex;align-items:center;gap:12px}input[type=range]{width:100%;min-width:0;accent-color:#de00a5;min-height:38px;cursor:pointer}output{display:block;min-width:75px;text-align:center;background:#f6e5f2;color:#7e005d;border-radius:5px;padding:8px 5px;font-size:19px;font-weight:700}.ends{display:flex;justify-content:space-between;font-size:12px;margin-right:87px}.controls{display:flex;align-items:stretch;gap:8px;margin-top:10px}.controls button{flex:1 1 0;min-width:0;min-height:42px;border:2px solid #b00084;background:#fff;color:#850065;border-radius:5px;padding:8px 5px;font:700 13px Europa,Arial,sans-serif;cursor:pointer}.controls button.primary{background:#de00a5;border-color:#de00a5;color:#fff;flex:1.35 1 0}.controls button:disabled{opacity:.55;cursor:not-allowed}.feedback{background:#f6eaf4;border-left:4px solid #de00a5;padding:10px 12px;font-size:13px;line-height:1.4;overflow-wrap:anywhere}.feedback strong{display:block;margin-bottom:3px}.feedback a{color:#850065}.feedback[hidden],.controls button[hidden]{display:none!important}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #111;outline-offset:2px}@media(max-width:390px){.quiz{padding:10px 12px}.controls{gap:5px}.controls button{font-size:12px;padding:7px 3px}}
</style></head><body><main class="quiz"><h1>What do you already know?</h1><p class="intro">Move the slider to make your guess, then reveal the answer.</p><div class="progress" id="progress" aria-live="polite">Question 1 of 5</div><div class="track" aria-hidden="true"><span id="bar"></span></div><form id="form"><fieldset><legend id="question"></legend><div class="guess"><input id="slider" type="range" aria-label="Your percentage guess"><output id="value" for="slider"></output></div><div class="ends"><span id="min"></span><span id="max"></span></div><div class="controls"><button id="minus" type="button">−5%</button><button id="plus" type="button">+5%</button><button class="primary" type="button" id="reveal">Reveal answer</button></div></fieldset></form><div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const questions=[
{q:'Approximately what percentage of the UK population lives with sight loss?',min:0,max:100,step:1,initial:50,unit:'%',answer:3,answerText:'Around 3% or more',feedback:'NHS 111 Wales reports more than 2 million people living with sight loss. Compared with the ONS mid-2025 UK population estimate of 69.5 million, that is at least approximately 3%. This is a calculated approximation, not a published prevalence rate.',url:'https://111.wales.nhs.uk/Blindnessandvisionloss/',year:'NHS; calculation using ONS mid-2025',extraUrl:'https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/bulletins/provisionalpopulationestimatefortheuk/mid2025'},
{q:'What percentage of the UK population is disabled?',min:0,max:100,step:1,initial:50,unit:'%',answer:25,answerText:'25% (one in four)',feedback:'DWP estimates that one in four people in the UK were disabled in 2024–25.',url:'https://www.gov.uk/government/statistics/family-resources-survey-financial-year-2024-to-2025/family-resources-survey-financial-year-2024-to-2025',year:'2024–25'},
{q:'Approximately what percentage of the UK population is autistic?',min:0,max:100,step:1,initial:50,unit:'%',answer:1,answerText:'Around 1%',feedback:'NHS England cites an estimate of one in 100 people in the UK. This is an estimate, not a count of diagnosed individuals.',url:'https://www.hee.nhs.uk/our-work/autism',year:'NHS England estimate'},
{q:'Approximately what percentage of people in the UK aged over 70 have some hearing loss?',min:0,max:100,step:1,initial:50,unit:'%',answer:70,answerText:'More than 70%',feedback:'NHS England guidance reports that more than 70% of people aged over 70 have some hearing loss. This percentage is for that age group, not the whole UK population.',url:'https://www.england.nhs.uk/wp-content/uploads/2017/09/guide-support-people-with-hearing-loss.pdf',year:'NHS England guidance (2017)'},
{q:'Approximately what percentage of the UK population has dyslexia?',min:0,max:100,step:1,initial:50,unit:'%',answer:10,answerText:'Around 10%',feedback:'An NHS trust toolkit reports that dyslexia is widely estimated to affect around 10% of the population.',url:'https://www.uhb.nhs.uk/Downloads/pdf/DyslexiaNeurodiversityToolkit.pdf',year:'NHS trust guidance (2023)'}
];let index=0,shown=false;const slider=$('slider');function formatted(n){return Number(n).toLocaleString('en-GB',{maximumFractionDigits:1})}function showValue(){const q=questions[index];$('value').textContent=formatted(slider.value)+q.unit;slider.setAttribute('aria-valuetext',formatted(slider.value)+q.unit)}function render(){const q=questions[index];shown=false;$('progress').textContent=`Question ${index+1} of ${questions.length}`;$('bar').style.width=((index+1)/questions.length*100)+'%';$('question').textContent=q.q;slider.min=q.min;slider.max=q.max;slider.step=q.step;slider.value=q.initial;slider.disabled=false;slider.setAttribute('aria-label','Your number guess');$('min').textContent=formatted(q.min)+q.unit;$('max').textContent=formatted(q.max)+q.unit;$('minus').disabled=false;$('plus').disabled=false;$('feedback').hidden=true;$('feedback').replaceChildren();$('reveal').textContent='Reveal answer';showValue()}slider.addEventListener('input',showValue);function adjust(delta){if(shown)return;const q=questions[index];const increment=5;slider.value=Math.max(q.min,Math.min(q.max,Math.round((Number(slider.value)+delta*increment)/q.step)*q.step));showValue();slider.focus()}$('minus').addEventListener('click',()=>adjust(-1));$('plus').addEventListener('click',()=>adjust(1));$('reveal').addEventListener('click',()=>{if(shown){advance();return}shown=true;const q=questions[index];const title=document.createElement('strong');title.textContent='Answer: '+q.answerText;const body=document.createElement('span');body.textContent=' You guessed '+formatted(slider.value)+q.unit+'. '+q.feedback+' ';const link=document.createElement('a');link.href=q.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='View source ('+q.year+')';$('feedback').replaceChildren(title,body,link);if(q.extraUrl){const more=document.createElement('a');more.href=q.extraUrl;more.target='_blank';more.rel='noopener noreferrer';more.textContent=' ONS population source';$('feedback').append(more)}$('feedback').hidden=false;slider.disabled=true;$('minus').disabled=true;$('plus').disabled=true;$('reveal').textContent=index===questions.length-1?'Finish':'Next question';$('reveal').focus()});function advance(){if(index<questions.length-1){index++;render()}else{$('form').hidden=true;$('progress').textContent='Complete: 5 of 5';$('bar').style.width='100%';$('feedback').hidden=false;$('feedback').replaceChildren();const h=document.createElement('strong');h.textContent='Thanks for taking part.';const p=document.createElement('span');p.textContent='These estimates are a starting point for thinking about who may be excluded by inaccessible information and services.';$('feedback').append(h,p)}}render()})();
</script></body></html>
