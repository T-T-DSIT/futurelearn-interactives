<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accessible links: quick knowledge check</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font:15px/1.35 Arial,Helvetica,sans-serif;color:#173441;background:#fff}.quiz{padding:12px 16px 14px;border-top:5px solid #126d69;max-width:720px;margin:auto}.tag{font-size:11px;font-weight:700;letter-spacing:.04em;color:#126d69;margin:0 0 6px}h1{font-size:20px;line-height:1.18;margin:0 0 7px}p{margin:0 0 7px}fieldset{border:0;padding:0;margin:0}legend{font-size:13px;font-weight:700;margin-bottom:5px}.option{display:flex;align-items:center;gap:9px;border:1px solid #c9dcd8;background:#f4f8f7;border-radius:6px;margin:5px 0;padding:7px 10px;min-height:37px;cursor:pointer}.option:has(input:checked){background:#e0f2ec;border:2px solid #126d69;padding:6px 9px}.option input{accent-color:#126d69;width:17px;height:17px;margin:0;flex-shrink:0}button{background:#126d69;border:0;color:white;font:700 13px Arial,sans-serif;padding:9px 15px;border-radius:5px;cursor:pointer;margin-top:4px}button:focus-visible,.option:focus-within{outline:3px solid #a75b00;outline-offset:2px}.bottom{display:flex;align-items:flex-start;gap:12px;margin-top:6px;flex-wrap:wrap}#feedback{flex:1;min-width:190px;background:#e7f3ef;border-left:4px solid #126d69;padding:8px 10px;border-radius:3px;font-size:13px;line-height:1.3;min-height:44px}#feedback strong{display:block;margin-bottom:2px}#feedback[hidden]{display:none}@media(max-width:400px){.quiz{padding:10px}h1{font-size:18px}.option{min-height:40px}.bottom{gap:7px}#feedback{min-width:100%}}
</style>
</head>
<body><main class="quiz"><div class="tag">DIGITAL ACCESSIBILITY · QUICK CHECK</div>
<h1>Which link text is most accessible?</h1>
<form id="quiz"><fieldset><legend>Select one answer</legend>
<label class="option"><input type="radio" name="answer" value="a">Click here</label>
<label class="option"><input type="radio" name="answer" value="b">Read the accessibility guidance</label>
<label class="option"><input type="radio" name="answer" value="c">More information</label>
</fieldset><div class="bottom"><button type="submit">Check answer</button><div id="feedback" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div></div></form>
</main><script>
(function(){const form=document.getElementById('quiz'),box=document.getElementById('feedback'),heading=document.getElementById('feedbackTitle'),detail=document.getElementById('feedbackText');form.addEventListener('submit',function(event){event.preventDefault();const chosen=form.querySelector('input[name="answer"]:checked');let title,description;if(!chosen){title='Select an answer';description='Choose an option before checking.';}else if(chosen.value==='b'){title='Correct';description='Descriptive links explain their destination, even out of context.';}else if(chosen.value==='a'){title='Not quite';description='“Click here” does not describe where the link leads.';}else{title='Not quite';description='“More information” does not identify the destination.';}heading.textContent=title;detail.textContent=description;box.hidden=false;box.focus({preventScroll:true});});})();
</script></body></html>
