<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessible links | Knowledge check</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#17313e;background:#f5f7f5}*{box-sizing:border-box}body{margin:0;padding:clamp(12px,4vw,40px)}main{max-width:740px;margin:auto;background:white;padding:clamp(20px,5vw,48px);border-top:8px solid #126b68;border-radius:10px;box-shadow:0 5px 25px #17313e15}.eyebrow{color:#126b68;font-size:.8rem;font-weight:700;letter-spacing:.08em}h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.2;margin:18px 0}p{line-height:1.55}fieldset{border:0;padding:0;margin:24px 0 0}legend{font-weight:bold;margin-bottom:12px}.choice{display:flex;align-items:center;gap:14px;border:2px solid #d7e5e2;background:#f4f8f7;border-radius:9px;padding:18px;margin:12px 0;cursor:pointer;min-height:62px}.choice:has(input:checked){border-color:#126b68;background:#e5f3ef}.choice input{width:20px;height:20px;accent-color:#126b68;flex-shrink:0}.choice:focus-within{outline:3px solid #f1ba4d;outline-offset:2px}button{border:0;background:#126b68;color:white;padding:13px 22px;border-radius:7px;font-weight:700;font-size:1rem;cursor:pointer}button:focus-visible{outline:3px solid #f1ba4d;outline-offset:3px}#feedback{margin-top:22px;padding:18px;border-left:5px solid #126b68;background:#eaf5f2;border-radius:5px}#feedback[hidden]{display:none}#feedback h2{font-size:1.15rem;margin:0 0 8px}#feedback p{margin:0}.small{color:#4c6068;font-size:.9rem}</style></head>
<body><main><div class="eyebrow">DIGITAL ACCESSIBILITY · QUICK KNOWLEDGE CHECK</div><h1>Which link text is most accessible?</h1><p>Select one answer, then check your response.</p><form id="quiz"><fieldset><legend>Choose one answer</legend><label class="choice"><input type="radio" name="answer" value="a">Click here</label><label class="choice"><input type="radio" name="answer" value="b">Read the accessibility guidance</label><label class="choice"><input type="radio" name="answer" value="c">More information</label></fieldset><button type="submit">Check answer</button></form><section id="feedback" hidden tabindex="-1" role="status" aria-live="polite"><h2 id="result"></h2><p id="explanation"></p></section><p class="small">Practice activity. Your answer is not recorded or sent anywhere.</p></main><script>
(function(){const root=document.querySelector('main');const form=root.querySelector('#quiz');const panel=root.querySelector('#feedback');const title=root.querySelector('#result');const desc=root.querySelector('#explanation');form.addEventListener('submit',function(e){e.preventDefault();const checked=form.querySelector('input[name="answer"]:checked');panel.hidden=false;if(!checked){title.textContent='Choose an answer';desc.textContent='Select one of the three options before checking.';}else if(checked.value==='b'){title.textContent='Correct';desc.textContent='Descriptive link text helps people understand where a link leads, including when links are read out of context.';}else{title.textContent='Not quite';desc.textContent=checked.value==='a'?'“Click here” does not explain where the link goes. Try a more descriptive option.':'“More information” is vague without context. Try a link that names its destination.';}panel.focus();});})();
</script></body></html>
